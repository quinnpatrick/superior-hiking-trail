<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autoplay YouTube Videos</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <!-- Video 1 -->
  <iframe
    src="https://www.youtube.com/embed/n0H5FkWkjjs?autoplay=1&mute=1&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>

  <!-- Video 2 -->
  <iframe
    src="https://www.youtube.com/embed/zTVWJ3Mc0Ag?autoplay=1&mute=1&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>

  <!-- Video 3 -->
  <iframe
    src="https://www.youtube.com/embed/HPS48TMmNag?autoplay=1&mute=1&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>

  <!-- Video 4 (placeholder) -->
  <iframe
    src="https://www.youtube.com/embed/sThx7mQM3Uc?autoplay=1&mute=1&rel=0"
    allow="autoplay; encrypted-media"
    allowfullscreen
  ></iframe>
  
  
</body>
</html>
